workflows:
  ios-workflow:
    name: Building Survey - iOS (unsigned, for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        WHAT3WORDS_API_KEY: 0QHNYNM8
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=WHAT3WORDS_API_KEY=$WHAT3WORDS_API_KEY
      - name: Package as an unsigned .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r BuildingSurvey-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/BuildingSurvey-unsigned.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com # <- put your own email here to get notified
        notify:
          success: true
          failure: true
